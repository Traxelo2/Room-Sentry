[project]
name = "roomsentry"
version = "1.8.0"
description = "Local-first webcam room watcher with person detection, alerts, and a private dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RoomSentry contributors" }]
keywords = ["opencv", "yolo", "webcam", "local-first", "privacy", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
  "ultralytics>=8.2.0",
  "opencv-python>=4.9.0",
  "requests>=2.31.0",
  "pystray>=0.19.5",
  "pillow>=10.0.0",
]
