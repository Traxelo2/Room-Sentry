name: Bug report
description: Report a RoomSentry problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / etc.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: python --version
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove secrets, webhook URLs, tokens, and private footage before posting.
      render: text
