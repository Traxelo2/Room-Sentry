name: CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create local config
        run: cp config.example.json config.json

      - name: Compile Python files
        run: |
          python -m py_compile room_sentry.py dashboard_server.py settings_gui.py doctor.py export_events.py migrate_config.py test_alerts.py test_discord.py open_dashboard.py

      - name: Migrate config
        run: python migrate_config.py

      - name: Run diagnostics without camera requirement
        run: python doctor.py || true
